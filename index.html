<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>일당관리</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f4e79">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="일당관리">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--ink:#1c2430;--mute:#6a7686;--line:#dde3ea;
  --pri:#1f4e79;--pri-ink:#fff;--acc:#e8f0f8;--ok:#1b7f4b;--warn:#b45309;--bad:#b42318;--on:#eaf6ee;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;min-height:38px}
button{white-space:nowrap;flex-shrink:0}
button:hover{background:var(--acc)}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri)}
button.pri:hover{background:#17405f}
button.danger{color:var(--bad);border-color:#f0c4be}
button:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;min-height:38px;max-width:100%}
input[type=checkbox]{min-height:0;width:18px;height:18px;vertical-align:middle}
header.top{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;flex-wrap:wrap}
header.top h1{font-size:18px;margin:0;font-weight:700}
nav.tabs{display:flex;gap:4px;flex:1}
nav.tabs button{background:transparent;color:#cfe0f1;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
nav.tabs button.on{background:#fff;color:var(--pri)}
nav.tabs button:hover:not(.on){background:rgba(255,255,255,.14)}
#installBtn{background:#f4b942;color:#3b2a00;border:0;border-radius:999px;font-weight:700;padding:6px 12px;min-height:0;font-size:13px}
#saveChip{font-size:12.5px;background:rgba(255,255,255,.16);border:0;color:#fff;border-radius:999px;padding:6px 12px;min-height:0}
#saveChip.bad{background:#ffe3a3;color:#6b4300}
main{max-width:1180px;margin:0 auto;padding:14px 16px 90px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 10px}
.muted{color:var(--mute)} .small{font-size:12.5px}
.warn{background:#fff4e0;border:1px solid #f3cf8d;color:#6b4300;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.info{background:var(--acc);border:1px solid #c7d9ea;padding:8px 12px;border-radius:8px;margin-bottom:10px}
.datenav{display:flex;gap:4px;align-items:center}
.datenav input{width:150px}
.dlabel{font-weight:700;font-size:17px}
/* entry rows */
.row{display:grid;grid-template-columns:28px 1fr auto 110px;gap:10px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:6px}
.row.on{background:var(--on);border-color:#b6dcc4}
.row.off{background:#eef0f3;border-color:#d3d8df;color:#6a7686}
.row.off .nm b{text-decoration:line-through}
.row .nm b{font-size:16px}
.row .nm small{display:block;color:var(--mute)}
.ctl{display:flex;gap:4px;align-items:center}
.ctl button{width:44px;font-size:20px;font-weight:700;padding:0}
.ctl select{width:84px;text-align:center;font-weight:700;font-size:16px}
.amt{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.tag{display:inline-block;font-size:11.5px;background:#fde8c8;color:#7a4400;border-radius:6px;padding:1px 6px;margin-left:6px}
.sumbar{position:sticky;bottom:0;background:var(--pri);color:#fff;border-radius:10px;padding:10px 16px;display:flex;gap:18px;flex-wrap:wrap;justify-content:space-between;box-shadow:0 -2px 10px rgba(0,0,0,.15)}
.sumbar b{font-size:17px}
/* tables */
.tbl{width:100%;border-collapse:collapse;background:#fff}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;white-space:nowrap}
.tbl th{background:#e8eef5;font-weight:700}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums}
.tbl tr.tot td{font-weight:800;background:#f1f5fa}
.tbl tbody tr.click{cursor:pointer}.tbl tbody tr.click:hover{background:var(--acc)}
.scroll{overflow:auto;max-width:100%}
.mx td,.mx th{padding:4px 5px;text-align:center;min-width:26px}
.mx td.nm,.mx th.nm{text-align:left;min-width:80px;position:sticky;left:0;background:#fff}
.mx th.nm{background:#e8eef5}
.mx .sun{background:#fdeaea}.mx .sat{background:#eaf0fd}
.mx td.v{font-weight:700;color:var(--ok)}
/* dialog */
dialog{border:0;border-radius:14px;padding:0;width:min(640px,96vw);max-height:92vh;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(10,20,30,.5)}
.dh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:17px}
.db{padding:14px 18px;overflow:auto;max-height:70vh}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fg label{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--mute)}
.fg label.w2{grid-column:1/-1}
.fg input,.fg select,.fg textarea{color:var(--ink);font-size:15px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:#fff;font-size:13px;min-height:0}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:999px;z-index:99;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:.94}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.edit-grid{display:grid;grid-template-columns:1fr 130px 70px;gap:6px;align-items:center;margin-bottom:6px}
.edit-grid.site{grid-template-columns:1fr 140px 140px 70px 60px}
#printArea{display:none}
@media (max-width:760px){
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  input,select,textarea{font-size:16px}  /* iOS 자동 확대 방지 */
  header.top{padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));gap:8px;justify-content:space-between}
  header.top h1{font-size:17px}
  main{padding:10px 10px 24px}
  /* 하단 탭 바 */
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;flex:none;order:0;width:auto}
  nav.tabs button{flex:1;color:var(--mute);border-radius:10px;padding:8px 2px;min-height:48px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;line-height:1.2}
  nav.tabs button::before{content:attr(data-ic);font-size:20px}
  nav.tabs button.on{background:var(--acc);color:var(--pri)}
  nav.tabs button:hover:not(.on){background:transparent}
  .datenav{flex:1;min-width:0}.datenav input{flex:1;width:auto;min-width:0}
  .bar{gap:6px}
  .bar.bulk-wrap button{flex:1 1 40%}
  .bar.bulk-wrap>label{flex:1 1 40%}
  .bar.bulk-wrap select{flex:1 1 40%}
  .bar>.dlabel{flex:1 1 100%;order:3}
  .bar>label:has(#dSite){flex:1 1 100%;display:flex;gap:8px;align-items:center;order:4}
  .bar>label:has(#dSite) select{flex:1}
  .bar>span[style*='flex:1']{display:none}
  .row{grid-template-columns:28px 1fr 104px;grid-template-areas:"c n a" "c t t";padding:10px}
  .row>:nth-child(1){grid-area:c}.row>:nth-child(2){grid-area:n}
  .row .ctl{grid-area:t;justify-content:flex-start}
  .row .amt{grid-area:a}
  .ctl button{width:56px;min-height:46px}.ctl select{width:100px;min-height:46px}
  .sumbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom));padding:10px 12px;border-radius:12px}
  input[type=checkbox]{width:22px;height:22px}
  .fg{grid-template-columns:1fr}
  .two{grid-template-columns:1fr}
  .edit-grid{grid-template-columns:1fr 1fr 64px}
  .edit-grid.site{grid-template-columns:1fr 1fr}
  .edit-grid.site input:first-child{grid-column:1/-1}
  /* 인부 목록: 중요한 열만 */
  #wTbl th:nth-child(5),#wTbl td:nth-child(5),#wTbl th:nth-child(6),#wTbl td:nth-child(6),#wTbl th:nth-child(7),#wTbl td:nth-child(7){display:none}
  /* 대화창은 전체 화면 */
  dialog{width:100vw;max-width:100vw;height:100dvh;max-height:100dvh;border-radius:0;margin:0}
  dialog[open]{display:flex;flex-direction:column}
  dialog form{display:flex;flex-direction:column;flex:1;min-height:0}
  .db{max-height:none;flex:1;overflow:auto}
  .df{padding-bottom:calc(12px + env(safe-area-inset-bottom));position:sticky;bottom:0;background:#fff}
  .df button{flex:1}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom))}
  .dlabel{font-size:15px}
}
@media (display-mode:standalone){ #installBtn{display:none!important} }
@media print{
  @page{size:A4 landscape;margin:10mm}
  body{background:#fff}
  body.printing header.top,body.printing main,body.printing #toast,body.printing dialog{display:none!important}
  body.printing #printArea{display:block}
  #printArea h1{font-size:18px;margin:0 0 4px}
  #printArea .sub{margin:0 0 8px;font-size:12px;color:#444}
  #printArea table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:11px}
  #printArea th,#printArea td{border:1px solid #888;padding:3px 5px;text-align:left}
  #printArea th{background:#e5e9ef}
  #printArea td.n,#printArea th.n{text-align:right}
  #printArea .mx td,#printArea .mx th{text-align:center;padding:2px 3px}
  #printArea .mx td.nm{text-align:left}
  #printArea tr.tot td{font-weight:700;background:#f0f0f0}
  #printArea .pb{break-before:page}
  #printArea .sun{background:#f6dede}
}
</style>
</head>
<body>
<header class="top">
  <h1>🏗 일당관리</h1>
  <nav class="tabs" id="tabs">
    <button data-tab="entry" data-ic="📝">공수 입력</button>
    <button data-tab="workers" data-ic="👷">인부</button>
    <button data-tab="report" data-ic="📊">정산</button>
    <button data-tab="settings" data-ic="⚙️">설정</button>
  </nav>
  <button id="installBtn" data-act="install" hidden>📲 앱 설치</button>
  <button id="saveChip" data-act="goSave" title="저장 상태"></button>
</header>
<main id="app"></main>
<div id="printArea"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script>
'use strict';
/* ====================== 기본 유틸 ====================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won = n => (Math.round(n) || 0).toLocaleString('ko-KR');
const fu = u => Number(u).toFixed(1);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate() + n); return iso(d); };
const DOW = ['일', '월', '화', '수', '목', '금', '토'];
const today = () => iso(new Date());
const dlabel = s => { const d = parseD(s); return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 (${DOW[d.getDay()]})`; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const UNITS = [0.5, 1, 1.5, 2, 2.5, 3, 3.5, 4];
const TAX = { wh33: '3.3% 원천징수', biz: '사업자(세금계산서)', none: '공제 없음', custom: '직접 세율' };
const taxLabel = w => w.taxType === 'custom' ? `세율 ${w.taxRate || 0}%` : (TAX[w.taxType] || '');
const maskRRN = s => s ? String(s).replace(/^(\d{6})-?(\d)\d{6}$/, '$1-$2******') : '';
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400); }

/* ====================== 데이터 ====================== */
const LS_KEY = 'ildang_v1', UI_KEY = 'ildang_ui_v1';
let S, ui = { tab: 'entry', date: today(), site: '', sel: [], from: '', to: '', rsite: '', pii: false };

function defaultState() {
  const sid = uid();
  return {
    version: 1,
    meta: { createdAt: Date.now(), updatedAt: Date.now(), lastBackup: 0, setupDone: false },
    company: { name: '', owner: '' },
    grades: ['조공0', '조공1', '준계장0', '준계장1', '계장0', '계장1'].map(n => ({ name: n, rate: 0 })),
    sites: [{ id: sid, name: '기본 현장', start: '', end: '', active: true }],
    workers: [],
    records: {}
  };
}
function load() {
  try { const j = localStorage.getItem(LS_KEY); if (j) S = JSON.parse(j); } catch (e) {}
  if (!S) S = defaultState();
  try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY) || '{}')); } catch (e) {}
  ui.sel = [];
  if (!S.sites.find(s => s.id === ui.site)) ui.site = (S.sites.find(s => s.active) || S.sites[0]).id;
  if (!ui.date) ui.date = today();
}
function save() {
  S.meta.updatedAt = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast('⚠ 브라우저 저장 실패 (저장공간 부족?)'); }
  scheduleFile(); updateChip();
}
function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify({ tab: ui.tab, date: ui.date, site: ui.site, from: ui.from, to: ui.to, rsite: ui.rsite, pii: ui.pii })); } catch (e) {} }

const rk = (d, w, s) => `${d}|${w}|${s}`;
const W = id => S.workers.find(w => w.id === id);
const SITE = id => S.sites.find(s => s.id === id);
const gradeIdx = n => { const i = S.grades.findIndex(g => g.name === n); return i < 0 ? 99 : i; };
const gradeRate = n => (S.grades.find(g => g.name === n) || {}).rate || 0;
function setUnits(d, wid, sid, u) {
  const k = rk(d, wid, sid);
  if (!u) { delete S.records[k]; return; }
  const prev = S.records[k];
  if (u === 'off') { S.records[k] = { u: 0, off: 1, r: prev ? prev.r : (W(wid).rate || 0) }; return; }
  S.records[k] = { u, r: prev ? prev.r : (W(wid).rate || 0) };
}
function sortWorkers(a, b) { return gradeIdx(a.grade) - gradeIdx(b.grade) || a.name.localeCompare(b.name, 'ko'); }
function taxOf(w, gross) {
  switch (w.taxType) {
    case 'wh33': return { wh: Math.floor(gross * 0.03) + Math.floor(gross * 0.003), vat: 0 };
    case 'biz': return { wh: 0, vat: Math.round(gross * 0.1) };
    case 'custom': return { wh: Math.floor(gross * (Number(w.taxRate) || 0) / 100), vat: 0 };
    default: return { wh: 0, vat: 0 };
  }
}

/* ====================== 파일 자동저장 (File System Access) ====================== */
const fsOK = 'showSaveFilePicker' in window;
let fileHandle = null, filePerm = false, lastFileSave = null, ft;
function idb() { return new Promise((res, rej) => { const r = indexedDB.open('ildang', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbGet(k) { const db = await idb(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); }
async function idbSet(k, v) { const db = await idb(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); }
async function initFile() {
  if (!fsOK) return;
  try { fileHandle = await idbGet('handle'); if (fileHandle) filePerm = (await fileHandle.queryPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { fileHandle = null; }
  updateChip();
}
async function writeFile() {
  if (!fileHandle || !filePerm) return;
  try { const w = await fileHandle.createWritable(); await w.write(JSON.stringify(S)); await w.close(); lastFileSave = new Date(); }
  catch (e) { filePerm = false; }
  updateChip();
}
function scheduleFile() { clearTimeout(ft); ft = setTimeout(writeFile, 600); }
async function reauthFile() {
  try { filePerm = (await fileHandle.requestPermission({ mode: 'readwrite' })) === 'granted'; } catch (e) { filePerm = false; }
  if (filePerm) { await writeFile(); toast('저장 파일 연결됨'); }
  updateChip(); if (ui.tab === 'settings') render();
}
async function createFile() {
  try {
    const h = await showSaveFilePicker({ suggestedName: '일당관리_데이터.json', types: [{ description: '일당관리 데이터', accept: { 'application/json': ['.json'] } }] });
    fileHandle = h; filePerm = true; await idbSet('handle', h); await writeFile();
    toast('저장 파일이 만들어졌습니다. 이제 입력 즉시 자동 저장됩니다.');
  } catch (e) { if (e.name !== 'AbortError') toast('파일 생성 실패: ' + e.message); }
  updateChip(); if (ui.tab === 'settings') render();
}
async function openFile() {
  try {
    const [h] = await showOpenFilePicker({ types: [{ description: '일당관리 데이터', accept: { 'application/json': ['.json'] } }] });
    const d = JSON.parse(await (await h.getFile()).text());
    if (!d || !Array.isArray(d.workers) || !d.records) throw new Error('일당관리 데이터 파일이 아닙니다');
    if (!confirm(`이 파일의 내용(인부 ${d.workers.length}명)으로 현재 데이터를 교체합니다. 계속할까요?`)) return;
    S = d; fileHandle = h;
    filePerm = (await h.requestPermission({ mode: 'readwrite' })) === 'granted';
    await idbSet('handle', h); save(); toast('불러왔습니다'); render();
  } catch (e) { if (e.name !== 'AbortError') toast('열기 실패: ' + e.message); }
}
function updateChip() {
  const c = $('#saveChip'); if (!c) return;
  c.classList.remove('bad');
  if (fileHandle && filePerm) c.textContent = '💾 파일 자동저장 중' + (lastFileSave ? ` (${pad(lastFileSave.getHours())}:${pad(lastFileSave.getMinutes())})` : '');
  else if (fileHandle) { c.textContent = '⚠ 저장 파일 재연결 필요'; c.classList.add('bad'); }
  else if (fsOK) { c.textContent = '⚠ 저장 파일 미연결 (브라우저 저장만)'; c.classList.add('bad'); }
  else c.textContent = '💾 브라우저에 자동저장';
}

/* ====================== 화면 공통 ====================== */
const app = $('#app');
function render() {
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === ui.tab));
  ({ entry: viewEntry, workers: viewWorkers, report: viewReport, settings: viewSettings })[ui.tab]();
  saveUI(); updateChip();
}
function openDlg(html) { const d = $('#dlg'); d.innerHTML = html; if (!d.open) d.showModal(); return d; }
function closeDlg() { const d = $('#dlg'); if (d.open) d.close(); }
const siteOpts = (sel, all) => (all ? `<option value="">전체 현장</option>` : '') + S.sites.map(s => `<option value="${s.id}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}${s.active ? '' : ' (종료)'}</option>`).join('');
const unitOpts = (sel, zero, off) => (zero ? `<option value="0" ${!sel ? 'selected' : ''}>-</option>` : '') + UNITS.map(u => `<option value="${u}" ${u === sel ? 'selected' : ''}>${fu(u)}</option>`).join('') + (off ? `<option value="off" ${sel === 'off' ? 'selected' : ''}>휴무</option>` : '');

/* ====================== 공수 입력 ====================== */
function viewEntry() {
  const act = S.sites.filter(s => s.active || s.id === ui.site);
  app.innerHTML = `

      ${fsOK ? `<button class="pri" data-act="mkFile">저장 파일 만들기 / 위치 바꾸기</button><button data-act="opFile">기존 저장 파일 열기</button>` : ''}
      <button data-act="bkDown">백업 파일 내려받기 (.json)</button>
      <button data-act="bkUp">백업 파일 불러오기</button>
      <input type="file" id="bkFile" accept=".json,application/json" hidden>
    </div>
    <p class="muted small" style="margin:0">마지막 수동 백업: ${lb} · 노트북에서 저장 파일을 <b>클라우드 동기화 폴더(OneDrive·구글 드라이브 등)</b>에 만들어 두면 PC가 고장 나도 안전합니다. 스마트폰은 노트북과 자동 동기화되지 않으므로 백업 파일로 옮기세요.</p></div>
  <div class="card"><h2>상호 · 사업주</h2><div class="fg">
    <label>상호(정산서 제목)<input id="coName" value="${esc(S.company.name)}"></label><label>사업주 이름<input id="coOwner" value="${esc(S.company.owner)}"></label></div></div>
  <div class="card"><h2>등급 · 기본 일당</h2><p class="muted small" style="margin-top:0">인부 등록 시 등급을 고르면 아래 일당이 기본값으로 들어갑니다. 인부별 개별 단가는 인부 정보에서 따로 바꿀 수 있습니다.</p>
    <div id="gList">${S.grades.map((g, i) => `<div class="edit-grid"><input class="gn" data-i="${i}" value="${esc(g.name)}"><input class="gr" data-i="${i}" value="${g.rate ? won(g.rate) : ''}" inputmode="numeric" placeholder="기본 일당"><button data-act="delGrade" data-i="${i}" class="danger">삭제</button></div>`).join('')}</div>
    <button data-act="addGrade">+ 등급 추가</button></div>
  <div class="card"><h2>현장 · 공사기간</h2><p class="muted small" style="margin-top:0">현장이 하나뿐이어도 그대로 쓰면 됩니다. 시작·종료일을 정하면 그 밖의 날짜에 입력할 때 경고가 뜹니다.</p>
    <div id="sList">${S.sites.map((s, i) => `<div class="edit-grid site"><input class="sn" data-i="${i}" value="${esc(s.name)}"><input type="date" class="ss" data-i="${i}" value="${s.start}" title="시작일"><input type="date" class="se" data-i="${i}" value="${s.end}" title="종료일"><label class="small"><input type="checkbox" class="sa" data-i="${i}" ${s.active ? 'checked' : ''}> 진행</label><button class="danger" data-act="delSite" data-i="${i}">삭제</button></div>`).join('')}</div>
    <button data-act="addSite">+ 현장 추가</button></div>
  <div class="card"><h2>⚠ 데이터 초기화</h2><button class="danger" data-act="wipe">모든 데이터 삭제</button></div>`;
}
function readSettings() {
  S.company.name = $('#coName').value.trim(); S.company.owner = $('#coOwner').value.trim();
  const names = new Map(S.grades.map((g, i) => [i, g.name]));
  $$('.gn').forEach(el => {
    const i = +el.dataset.i, nn = el.value.trim() || names.get(i);
    if (nn !== names.get(i)) { S.workers.forEach(w => { if (w.grade === names.get(i)) w.grade = nn; }); S.grades[i].name = nn; }
  });
  $$('.gr').forEach(el => { S.grades[+el.dataset.i].rate = parseInt(el.value.replace(/\D/g, '')) || 0; });
  $$('.sn').forEach(el => { S.sites[+el.dataset.i].name = el.value.trim() || S.sites[+el.dataset.i].name; });
  $$('.ss').forEach(el => S.sites[+el.dataset.i].start = el.value);
  $$('.se').forEach(el => S.sites[+el.dataset.i].end = el.value);
  $$('.sa').forEach(el => S.sites[+el.dataset.i].active = el.checked);
  if (!S.sites.some(s => s.active)) S.sites[0].active = true;
  save();
}

/* ====================== 이벤트 ====================== */
let deferredInstall = null;
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (!isStandalone()) $('#installBtn').hidden = false; });
window.addEventListener('appinstalled', () => { deferredInstall = null; $('#installBtn').hidden = true; toast('앱이 설치되었습니다'); });
const A = {
  async install() { if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice; deferredInstall = null; $('#installBtn').hidden = true; } else { ui.tab = 'settings'; render(); } },
  goSave() { ui.tab = 'settings'; render(); },
  dprev() { setDate(addDays(ui.date, -1)); }, dnext() { setDate(addDays(ui.date, 1)); }, dtoday() { setDate(today()); },
  dec(el) { const id = el.closest('.row').dataset.w, r = S.records[rk(ui.date, id, ui.site)]; changeUnits(id, (r ? r.u : 0) - 0.5); },
  inc(el) { const id = el.closest('.row').dataset.w, r = S.records[rk(ui.date, id, ui.site)]; changeUnits(id, (r ? r.u : 0) + 0.5); },
  bulkApply, bulkClear, copyPrev, rangeModal, rangeApply,
  newWorker() { workerForm(null); }, editWorker(el) { workerForm(W(el.dataset.w)); }, saveWorker, delWorker,
  rpMonth(el) { const d = new Date(); d.setMonth(d.getMonth() + (+el.dataset.d), 1); ui.from = iso(d); ui.to = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); viewReport(); },
  rpAll() { ui.from = '2000-01-01'; ui.to = '2099-12-31'; const R = buildReport(ui.from, ui.to, ui.rsite); if (R.rows.length) { ui.from = R.minD; ui.to = R.maxD; } viewReport(); },
  rpSitePeriod() { const s = SITE(ui.rsite || ui.site); if (!s.start && !s.end) return toast('설정 탭에서 현장 공사기간을 먼저 입력하세요'); ui.from = s.start || ui.from; ui.to = s.end || ui.to; viewReport(); },
  exXlsx, exPdf, exShare,
  mkFile: createFile, opFile: openFile, reauth: reauthFile,
  bkDown() { download(new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' }), `일당관리_백업_${today()}.json`); S.meta.lastBackup = Date.now(); save(); viewSettings(); toast('백업 파일을 저장했습니다'); },
  bkUp() { $('#bkFile').click(); },
  addGrade() { readSettings(); S.grades.push({ name: '새 등급', rate: 0 }); save(); viewSettings(); },
  delGrade(el) { readSettings(); const i = +el.dataset.i, g = S.grades[i]; if (S.workers.some(w => w.grade === g.name)) return toast('이 등급을 쓰는 인부가 있어 삭제할 수 없습니다'); if (S.grades.length < 2) return; S.grades.splice(i, 1); save(); viewSettings(); },
  addSite() { readSettings(); S.sites.push({ id: uid(), name: `현장 ${S.sites.length + 1}`, start: '', end: '', active: true }); save(); viewSettings(); },
  delSite(el) { readSettings(); const i = +el.dataset.i, s = S.sites[i]; if (S.sites.length < 2) return toast('현장은 최소 1개가 필요합니다'); if (Object.keys(S.records).some(k => k.endsWith('|' + s.id))) return toast('근무 기록이 있는 현장은 삭제 대신 "진행" 체크를 해제하세요'); S.sites.splice(i, 1); if (ui.site === s.id) ui.site = S.sites[0].id; save(); viewSettings(); },
  wipe() { if (confirm('인부·근무 기록이 모두 삭제됩니다. 정말 삭제할까요?') && confirm('되돌릴 수 없습니다. 먼저 백업하셨나요? 최종 삭제합니다.')) { S = defaultState(); S.meta.setupDone = true; ui.site = S.sites[0].id; save(); render(); } }
};
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (t && A[t.dataset.act]) { e.preventDefault(); A[t.dataset.act](t, e); return; }
  const tb = e.target.closest('#tabs button'); if (tb) { ui.tab = tb.dataset.tab; render(); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'dDate') { if (t.value) setDate(t.value); }
  else if (t.id === 'dSite') { ui.site = t.value; ui.sel = []; saveUI(); renderEntry(); }
  else if (t.id === 'chkAll') { const ws = entryWorkers().map(w => w.id); ui.sel = t.checked ? ws : []; $$('.row .sel').forEach(c => c.checked = t.checked); }
  else if (t.classList.contains('sel') && t.closest('.row')) { const id = t.closest('.row').dataset.w; ui.sel = t.checked ? [...new Set([...ui.sel, id])] : ui.sel.filter(x => x !== id); }
  else if (t.classList.contains('usel')) changeUnits(t.closest('.row').dataset.w, t.value === 'off' ? 'off' : (parseFloat(t.value) || 0));
  else if (t.id === 'dGrade' || t.id === 'dOnly') renderEntry();
  else if (t.id === 'wGrade' || t.id === 'wInact') renderWorkers();
  else if (t.id === 'rpFrom') { ui.from = t.value; renderReport(); saveUI(); }
  else if (t.id === 'rpTo') { ui.to = t.value; renderReport(); saveUI(); }
  else if (t.id === 'rpSite') { ui.rsite = t.value; renderReport(); saveUI(); }
  else if (t.id === 'rpPii') { ui.pii = t.checked; saveUI(); }
  else if (t.id === 'bkFile') {
    const f = t.files[0]; if (!f) return;
    f.text().then(txt => { try { const d = JSON.parse(txt); if (!d || !Array.isArray(d.workers) || !d.records) throw 0; if (!confirm(`백업 파일(인부 ${d.workers.length}명)로 현재 데이터를 교체합니다. 계속할까요?`)) return; S = d; ui.site = (S.sites.find(s => s.active) || S.sites[0]).id; save(); render(); toast('불러왔습니다'); } catch (er) { toast('올바른 백업 파일이 아닙니다'); } });
  }
  else if (ui.tab === 'settings' && t.closest('#app')) { readSettings(); if (t.classList.contains('gr')) t.value = S.grades[+t.dataset.i].rate ? won(S.grades[+t.dataset.i].rate) : ''; }
});
document.addEventListener('input', e => { if (e.target.id === 'dSearch') renderEntry(); else if (e.target.id === 'wSearch') renderWorkers(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) writeFile(); });

/* ====================== 시작 ====================== */
function welcome() {
  openDlg(`<div class="dh">처음 오셨네요 👋</div><div class="db">
    <p>이 앱은 로그인 없이 <b>이 기기 안에만</b> 데이터를 저장합니다. 입력하면 바로 자동 저장됩니다.</p>
    ${fsOK ? `<p>노트북에서는 <b>저장 파일</b>을 하나 만들어 두면, 입력할 때마다 그 파일에도 자동 저장되어 브라우저 데이터를 지워도 안전합니다. (OneDrive·구글 드라이브 폴더에 만들면 더 좋습니다)</p>` : `<p>이 브라우저는 파일 자동저장을 지원하지 않습니다. <b>[설정] → 백업 파일 내려받기</b>를 주기적으로 해주세요.</p>`}
    <p class="muted small">시작 순서: ① 설정에서 등급 기본 일당·현장 확인 → ② 인부 등록 → ③ 공수 입력</p></div>
    <div class="df"><button onclick="closeDlg()">나중에</button>${fsOK ? '<button class="pri" id="wlcFile">저장 파일 만들기</button>' : ''}</div>`);
  const b = $('#wlcFile'); if (b) b.onclick = async () => { closeDlg(); await createFile(); };
  S.meta.setupDone = true; save();
}
load();
render();
initFile().then(() => { if (!S.meta.setupDone) welcome(); else if (fileHandle && !filePerm) toast('저장 파일 재연결이 필요합니다. 위쪽 노란 버튼을 눌러주세요'); });
try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
